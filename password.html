<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Members Access | High Value Her</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  body {
    font-family:'DM Sans',sans-serif;
    background:#0f0608;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Background texture */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(139,34,82,0.35) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(27,79,92,0.2) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 0% 100%, rgba(201,168,76,0.08) 0%, transparent 50%);
    pointer-events:none;
    z-index:0;
  }

  /* Decorative gold lines */
  body::after {
    content:'';
    position:fixed;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px;
    height:100vh;
    background:linear-gradient(to bottom, transparent, rgba(201,168,76,0.15), transparent);
    pointer-events:none;
    z-index:0;
  }

  .container {
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from{opacity:0;transform:translateY(24px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* Top ornament */
  .ornament {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:32px;
  }
  .ornament-line {
    width:48px;
    height:1px;
    background:linear-gradient(to right, transparent, rgba(201,168,76,0.6));
  }
  .ornament-line.right {
    background:linear-gradient(to left, transparent, rgba(201,168,76,0.6));
  }
  .ornament-diamond {
    width:6px;
    height:6px;
    background:var(--gold,#C9A84C);
    transform:rotate(45deg);
  }

  /* Brand */
  .brand {
    font-family:'Cormorant Garamond',serif;
    font-size:13px;
    font-weight:400;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:rgba(201,168,76,0.8);
    margin-bottom:20px;
    text-align:center;
  }

  .headline {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(36px,8vw,52px);
    font-weight:300;
    line-height:1.1;
    text-align:center;
    color:#fff;
    margin-bottom:10px;
  }

  .headline em {
    font-style:italic;
    color:rgba(232,160,176,0.9);
  }

  .subline {
    font-size:13px;
    font-weight:300;
    color:rgba(255,255,255,0.4);
    text-align:center;
    margin-bottom:40px;
    letter-spacing:0.02em;
    line-height:1.6;
  }

  /* Card */
  .card {
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,168,76,0.2);
    border-radius:3px;
    padding:36px 32px;
    backdrop-filter:blur(12px);
    position:relative;
  }

  .card::before {
    content:'';
    position:absolute;
    top:0; left:24px; right:24px;
    height:1px;
    background:linear-gradient(to right, transparent, rgba(201,168,76,0.5), transparent);
  }

  .input-label {
    font-size:10px;
    font-weight:500;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:rgba(201,168,76,0.7);
    margin-bottom:10px;
    display:block;
  }

  .input-wrap {
    position:relative;
    margin-bottom:20px;
  }

  .input-wrap svg {
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.4;
    pointer-events:none;
  }

  input[type="password"] {
    width:100%;
    padding:14px 14px 14px 42px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(201,168,76,0.25);
    border-radius:2px;
    color:#fff;
    font-family:'DM Sans',sans-serif;
    font-size:15px;
    font-weight:300;
    letter-spacing:0.15em;
    outline:none;
    transition:border-color 0.3s, background 0.3s;
  }

  input[type="password"]:focus {
    border-color:rgba(201,168,76,0.6);
    background:rgba(255,255,255,0.09);
  }

  input[type="password"]::placeholder {
    color:rgba(255,255,255,0.2);
    letter-spacing:0.08em;
    font-size:13px;
  }

  .btn {
    width:100%;
    padding:15px;
    background:linear-gradient(135deg, #8B2252, #B5476E);
    border:none;
    border-radius:2px;
    color:#fff;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.18em;
    text-transform:uppercase;
    cursor:pointer;
    transition:opacity 0.3s, transform 0.2s;
    position:relative;
    overflow:hidden;
  }

  .btn::after {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(201,168,76,0.15), transparent);
    opacity:0;
    transition:opacity 0.3s;
  }

  .btn:hover { opacity:0.92; transform:translateY(-1px); }
  .btn:hover::after { opacity:1; }
  .btn:active { transform:translateY(0); }

  .error {
    display:none;
    margin-top:14px;
    padding:10px 14px;
    background:rgba(192,57,43,0.15);
    border:1px solid rgba(192,57,43,0.3);
    border-radius:2px;
    font-size:12px;
    color:rgba(255,180,170,0.9);
    text-align:center;
    letter-spacing:0.02em;
  }

  .error.show { display:block; animation:shake 0.4s ease; }

  @keyframes shake {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* Footer */
  .footer-note {
    margin-top:28px;
    font-size:11.5px;
    color:rgba(255,255,255,0.25);
    text-align:center;
    line-height:1.7;
  }

  .footer-note a {
    color:rgba(201,168,76,0.6);
    text-decoration:none;
    border-bottom:1px solid rgba(201,168,76,0.2);
    transition:color 0.2s;
  }

  .footer-note a:hover { color:rgba(201,168,76,0.9); }

  /* WhatsApp Float */
  .wa-float {
    position:fixed;
    bottom:24px;
    right:24px;
    z-index:999;
    width:52px;
    height:52px;
    background:#25D366;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 20px rgba(37,211,102,0.4);
    text-decoration:none;
    transition:transform 0.3s, box-shadow 0.3s;
    animation:waPulse 2.5s ease-in-out infinite;
  }

  .wa-float:hover {
    transform:scale(1.1);
    box-shadow:0 6px 28px rgba(37,211,102,0.5);
    animation:none;
  }

  @keyframes waPulse {
    0%,100%{box-shadow:0 4px 20px rgba(37,211,102,0.4);}
    50%{box-shadow:0 4px 32px rgba(37,211,102,0.65);}
  }

  .wa-float svg { width:26px; height:26px; }
</style>
</head>
<body>

<div class="container">

  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line right"></div>
  </div>

  <div class="brand">High Value Her</div>

  <h1 class="headline">Members<br><em>Only Access</em></h1>
  <p class="subline">Enter your password to access<br>your exclusive content.</p>

  <div class="card">
    <label class="input-label" for="pw">Your Password</label>
    <div class="input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="pw" placeholder="Enter your password" autocomplete="off"/>
    </div>
    <button class="btn" onclick="checkPassword()">Access My Content</button>
    <div class="error" id="error">Incorrect password. Check your WhatsApp message.</div>
  </div>

  <p class="footer-note">
    Lost your password?&nbsp;
    <a href="https://wa.me/2349031375718?text=Hi%2C%20I%20lost%20my%20members%20area%20password" target="_blank">WhatsApp us</a>
  </p>

</div>

  <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">

<script>
function checkPassword() {
  var val = document.getElementById('pw').value.trim();
  var err = document.getElementById('error');
  if (val === 'HVH2026') {
    document.querySelector('.btn').textContent = 'Welcome...';
    document.querySelector('.btn').style.background = 'linear-gradient(135deg,#1B4F5C,#2d7a8a)';
    setTimeout(function(){ window.location.href = 'members.html'; }, 600);
  } else {
    err.classList.remove('show');
    void err.offsetWidth;
    err.classList.add('show');
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

document.getElementById('pw').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPassword();
});
</script>

</body>
</html>
